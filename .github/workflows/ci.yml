name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # v5 of both: the v4 lines ran on the Node 20 action runtime, which
      # GitHub deprecated on runners in late 2025 — every run warned that it
      # was being forced onto Node 24. v5 targets Node 24 natively. This is
      # the runtime the ACTION executes on, unrelated to node-version below,
      # which stays the project's own toolchain.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` respects the lockfile exactly, which is the point of running
      # this at all — it catches "works on my machine" dependency drift.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Advisory only: a vulnerable transitive dependency should be visible in
      # the run without blocking a merge on something that may have no patch yet.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
